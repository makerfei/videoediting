<!DOCTYPE html>
<html>
<head>
    <script src="https://unpkg.com/konva@9/konva.min.js"></script>
</head>
<body>
    <div id="container" style="width: 800px; height: 600px; background: #f0f0f0;"></div>

    <script>
        const stage = new Konva.Stage({
            container: 'container',
            width: 800,
            height: 600,
        });
        const layer = new Konva.Layer();
        stage.add(layer);

        const tr = new Konva.Transformer();
        layer.add(tr);

        const img = new Image();
        img.src = 'https://picsum.photos/200/200';
        
        img.onload = () => {
            const konvaImg = new Konva.Image({
                x: 100,
                y: 100,
                image: img,
                draggable: true,
            });
            
            layer.add(konvaImg);
            
            // ✅ 关键：在添加后绑定事件
            konvaImg.on('click', (e) => {
                console.log('图片被点击了！');
                e.cancelBubble = true; // ✅ 关键：阻止冒泡
                tr.nodes([konvaImg]);
                layer.batchDraw();
            });

            layer.draw();
        };

        // 点击空白处取消选中
        stage.on('click', (e) => {
            if (e.target === stage) {
                console.log('点击了空白处');
                tr.nodes([]);
                layer.batchDraw();
            }
        });
    </script>
</body>
</html>
