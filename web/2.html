<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Konva 图层编辑器与动画播放器</title>
    <!-- 引入 Tailwind CSS 用于快速样式 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Konva -->
    <script src="https://unpkg.com/konva@9.2.0/konva.min.js"></script>
    <!-- 引入 GSAP 用于平滑动画过渡 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background-color: #f3f4f6; }
        #container {
            background-image: 
                linear-gradient(45deg, #e5e7eb 25%, transparent 25%), 
                linear-gradient(-45deg, #e5e7eb 25%, transparent 25%), 
                linear-gradient(45deg, transparent 75%, #e5e7eb 75%), 
                linear-gradient(-45deg, transparent 75%, #e5e7eb 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.05);
        }
        /* 自定义滚动条 */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #c1c1c1; border-radius: 3px; }
        
        .layer-card.active { border-color: #3b82f6; background-color: #eff6ff; }
    </style>
</head>
<body class="h-screen flex flex-col text-gray-800 font-sans">

    <!-- 顶部工具栏 -->
    <header class="bg-white border-b border-gray-200 h-14 flex items-center justify-between px-6 shadow-sm z-10">
        <div class="flex items-center gap-2">
            <div class="w-8 h-8 bg-blue-600 rounded flex items-center justify-center text-white font-bold">K</div>
            <h1 class="font-bold text-lg">Konva Editor</h1>
        </div>
        <div class="flex items-center gap-3">
            <button onclick="addRect()" class="px-3 py-1.5 text-sm bg-gray-100 hover:bg-gray-200 rounded transition">
                <i class="fa-solid fa-square"></i> 添加矩形
            </button>
            <button onclick="addImage()" class="px-3 py-1.5 text-sm bg-gray-100 hover:bg-gray-200 rounded transition">
                <i class="fa-regular fa-image"></i> 添加图片
            </button>
            <div class="h-6 w-px bg-gray-300 mx-1"></div>
            <button onclick="recordKeyframe()" class="px-3 py-1.5 text-sm bg-indigo-50 text-indigo-600 border border-indigo-200 hover:bg-indigo-100 rounded transition">
                <i class="fa-solid fa-camera"></i> 记录关键帧
            </button>
            <button onclick="playAnimation()" class="px-3 py-1.5 text-sm bg-green-600 text-white hover:bg-green-700 rounded transition shadow-sm">
                <i class="fa-solid fa-play"></i> 播放动画
            </button>
            <button onclick="clearFrames()" class="px-3 py-1.5 text-sm text-red-500 hover:bg-red-50 rounded transition">
                <i class="fa-solid fa-trash"></i> 清空帧
            </button>
        </div>
    </header>

    <!-- 主体区域 -->
    <main class="flex-1 flex overflow-hidden">
        
        <!-- 左侧面板：图层列表与关键帧 -->
        <aside class="w-72 bg-white border-r border-gray-200 flex flex-col z-10">
            <!-- 关键帧列表 -->
            <div class="flex-1 flex flex-col min-h-0 border-b border-gray-200">
                <div class="p-3 bg-gray-50 border-b border-gray-200 flex justify-between items-center">
                    <span class="text-xs font-semibold text-gray-500 uppercase">关键帧序列 (<span id="frame-count">0</span>)</span>
                </div>
                <div id="frames-list" class="flex-1 overflow-y-auto p-2 space-y-2">
                    <div class="text-center text-gray-400 text-xs mt-4">点击“记录关键帧”开始制作动画</div>
                </div>
            </div>

            <!-- 属性预览 -->
            <div class="h-48 flex flex-col">
                <div class="p-2 bg-gray-50 border-b border-gray-200 text-xs font-semibold text-gray-500">当前选中对象数据</div>
                <pre id="json-preview" class="flex-1 p-2 text-[10px] text-gray-600 overflow-auto font-mono bg-gray-50"></pre>
            </div>
        </aside>

        <!-- 中央舞台 -->
        <section class="flex-1 bg-gray-100 relative flex items-center justify-center p-8 overflow-hidden">
            <div id="container" class="shadow-lg bg-white"></div>
            
            <!-- 播放状态遮罩 -->
            <div id="play-overlay" class="absolute inset-0 bg-black/10 pointer-events-none hidden flex items-center justify-center z-50">
                <div class="bg-black/70 text-white px-4 py-2 rounded-full backdrop-blur">
                    <i class="fa-solid fa-circle-play mr-2"></i> 正在播放...
                </div>
            </div>
        </section>
    </main>

    <script>
        // --- 1. 初始化 Konva 舞台 ---
        const width = 800;
        const height = 600;

        const stage = new Konva.Stage({
            container: 'container',
            width: width,
            height: height,
        });

        const layer = new Konva.Layer();
        stage.add(layer);

        // 变换控制器 (Transformer) - 核心组件，提供拖拽、缩放、旋转手柄
        const tr = new Konva.Transformer({
            nodes: [],
            keepRatio: false, // 允许自由缩放
            enabledAnchors: ['top-left', 'top-right', 'bottom-left', 'bottom-right'], // 只保留四角缩放
            rotateAnchorOffset: 30, // 旋转手柄距离
            borderStroke: '#3b82f6',
            anchorStroke: '#3b82f6',
            anchorFill: '#ffffff',
            anchorSize: 10,
            borderDash: [4, 4]
        });
        layer.add(tr);

        // --- 2. 状态管理 ---
        let shapes = []; // 存储所有形状引用
        let keyframes = []; // 存储关键帧数据
        let selectedNode = null;

        // --- 3. 交互逻辑 ---

        // 点击舞台空白处取消选中
        stage.on('click tap', (e) => {
            if (e.target === stage) {
                debugger
                tr.nodes([]);
                selectedNode = null;
                updateJSONPreview(null);
                highlightLayerCard(null);
            }
        });

        // 添加矩形
        function addRect() {
            const rect = new Konva.Rect({
                x: 100 + Math.random() * 50,
                y: 100 + Math.random() * 50,
                width: 100,
                height: 100,
                fill: getRandomColor(),
                draggable: true,
                name: 'rect-' + Date.now(),
                cornerRadius: 8,
                shadowColor: 'black',
                shadowBlur: 10,
                shadowOpacity: 0.2,
                shadowOffset: { x: 5, y: 5 }
            });
            setupShapeEvents(rect);
            layer.add(rect);
            shapes.push(rect);
            selectShape(rect);
        }

        // 添加图片
        function addImage() {
            const imgObj = new Image();
            imgObj.crossOrigin = "Anonymous";
            imgObj.src = `https://picsum.photos/seed/${Math.floor(Math.random()*1000)}/200/200`;
            
            imgObj.onload = () => {
                const imageNode = new Konva.Image({
                    x: 150 + Math.random() * 50,
                    y: 150 + Math.random() * 50,
                    image: imgObj,
                    width: 200,
                    height: 200,
                    draggable: true,
                    name: 'img-' + Date.now()
                });
                setupShapeEvents(imageNode);
                layer.add(imageNode);
                shapes.push(imageNode);
                selectShape(imageNode);
            };
        }

        // 设置形状事件
        function setupShapeEvents(node) {
            node.on('click tap', (e) => {
                e.cancelBubble = true; // 阻止冒泡到 stage
                selectShape(node);
            });
            
            // 当拖拽或变换结束时，更新 JSON 预览
            node.on('dragend transformend', () => {
                updateJSONPreview(node);
            });
        }

        // 选中形状
        function selectShape(node) {
            selectedNode = node;
            tr.nodes([node]);
            updateJSONPreview(node);
            highlightLayerCard(node.name());
        }

        // --- 4. 关键帧与动画系统 ---

        // 记录关键帧
        function recordKeyframe() {
            // 序列化当前所有形状的状态
            // 我们只关心我们需要动画的属性：x, y, rotation, scaleX, scaleY, width, height, opacity
            const frameData = shapes.map(node => ({
                name: node.name(),
                type: node.getClassName(),
                x: node.x(),
                y: node.y(),
                rotation: node.rotation(),
                scaleX: node.scaleX(),
                scaleY: node.scaleY(),
                width: node.width(), // 对于 Image/Rect，有时修改的是 width 而不是 scale
                height: node.height(),
                opacity: node.opacity(),
                fill: node.fill ? node.fill() : null
            }));

            keyframes.push(frameData);
            renderFramesList();
            
            // 视觉反馈
            const btn = document.querySelector('button[onclick="recordKeyframe()"]');
            const originalHTML = btn.innerHTML;
            btn.innerHTML = '<i class="fa-solid fa-check"></i> 已记录';
            setTimeout(() => btn.innerHTML = originalHTML, 800);
        }

        // 渲染关键帧列表
        function renderFramesList() {
            const list = document.getElementById('frames-list');
            const count = document.getElementById('frame-count');
            count.innerText = keyframes.length;
            list.innerHTML = '';

            if (keyframes.length === 0) {
                list.innerHTML = '<div class="text-center text-gray-400 text-xs mt-4">暂无关键帧</div>';
                return;
            }

            keyframes.forEach((frame, index) => {
                const div = document.createElement('div');
                div.className = 'layer-card p-2 bg-white border border-gray-200 rounded text-xs cursor-pointer hover:border-blue-300 transition flex justify-between items-center';
                div.innerHTML = `
                    <span>帧 #${index + 1} <span class="text-gray-400 ml-1">(${frame.length} 个对象)</span></span>
                    <i class="fa-solid fa-chevron-right text-gray-300"></i>
                `;
                div.onclick = () => loadFrame(index);
                list.appendChild(div);
            });
        }

        // 加载特定帧（用于预览或编辑）
        function loadFrame(index) {
            if (index < 0 || index >= keyframes.length) return;
            
            const frameData = keyframes[index];
            
            // 简单恢复：遍历帧数据，找到对应的节点并应用属性
            // 注意：这只是一个简单的快照恢复，实际生产中可能需要处理新增/删除节点的情况
            frameData.forEach(data => {
                const node = shapes.find(s => s.name() === data.name);
                if (node) {
                    node.setAttrs({
                        x: data.x,
                        y: data.y,
                        rotation: data.rotation,
                        scaleX: data.scaleX,
                        scaleY: data.scaleY,
                        opacity: data.opacity
                    });
                    // 如果宽高变了且不是通过 scale 变的，也要更新
                    if(data.width) node.width(data.width);
                    if(data.height) node.height(data.height);
                }
            });
            layer.batchDraw();
            
            // 如果当前有选中，重新绑定 transformer
            if (selectedNode) {
                tr.nodes([selectedNode]);
            }
        }

        // 播放动画
        async function playAnimation() {
            if (keyframes.length < 2) {
                alert("请至少记录 2 个关键帧以形成动画！");
                return;
            }

            const overlay = document.getElementById('play-overlay');
            overlay.classList.remove('hidden');
            
            // 取消选中，避免播放时显示控制框
            tr.nodes([]);
            selectedNode = null;

            const durationPerFrame = 1; // 每帧之间过渡 1 秒

            // 从第 0 帧开始
            loadFrame(0);

            // 逐帧过渡
            for (let i = 1; i < keyframes.length; i++) {
                await animateToFrame(keyframes[i], durationPerFrame);
            }

            overlay.classList.add('hidden');
            // 播放结束后回到第一帧
            loadFrame(0);
        }

        // 使用 GSAP 平滑过渡到指定帧数据
        function animateToFrame(targetFrameData, duration) {
            return new Promise((resolve) => {
                const tweens = [];

                targetFrameData.forEach(data => {
                    const node = shapes.find(s => s.name() === data.name);
                    if (node) {
                        // 创建 GSAP tween
                        tweens.push(gsap.to(node, {
                            duration: duration,
                            x: data.x,
                            y: data.y,
                            rotation: data.rotation,
                            scaleX: data.scaleX,
                            scaleY: data.scaleY,
                            opacity: data.opacity,
                            onUpdate: () => layer.batchDraw(), // 每一帧更新 Canvas
                            onComplete: () => {} 
                        }));
                    }
                });

                // 等待所有动画完成
                setTimeout(() => {
                    layer.batchDraw();
                    resolve();
                }, duration * 1000);
            });
        }

        function clearFrames() {
            keyframes = [];
            renderFramesList();
        }

        // --- 5. 辅助函数 ---

        function getRandomColor() {
            const colors = ['#EF476F', '#FFD166', '#06D6A0', '#118AB2', '#073B4C'];
            return colors[Math.floor(Math.random() * colors.length)];
        }

        function updateJSONPreview(node) {
            const preview = document.getElementById('json-preview');
            if (!node) {
                preview.textContent = "未选中任何对象";
                return;
            }
            const data = {
                type: node.getClassName(),
                x: Math.round(node.x()),
                y: Math.round(node.y()),
                width: Math.round(node.width()),
                height: Math.round(node.height()),
                rotation: Math.round(node.rotation()),
                scaleX: node.scaleX().toFixed(2),
                scaleY: node.scaleY().toFixed(2),
                opacity: node.opacity()
            };
            preview.textContent = JSON.stringify(data, null, 2);
        }

        function highlightLayerCard(name) {
            // 这里可以扩展为左侧图层列表的高亮逻辑
            // 由于本示例左侧主要是关键帧列表，暂略
        }

        // 初始化添加一个矩形
        addRect();

    </script>
</body>
</html>
