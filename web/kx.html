
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GSAP + Konva 音频口型同步</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://unpkg.com/konva@9.3.6/konva.min.js"></script>
    <style>
        body {
            background-color: #0f172a;
            color: #e2e8f0;
            font-family: 'Inter', sans-serif;
        }
        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        /* 隐藏默认文件输入框 */
        input[type="file"] {
            display: none;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

    <!-- 头部标题 -->
    <header class="mb-8 text-center">
        <h1 class="text-4xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-cyan-400 to-blue-600 mb-2">
            Audio Lip Sync
        </h1>
        <p class="text-slate-400 text-sm">GSAP + Konva + Web Audio API</p>
    </header>

    <!-- 主容器 -->
    <main class="w-full max-w-4xl grid grid-cols-1 md:grid-cols-2 gap-8 items-center">
        
        <!-- 左侧：Konva 舞台 -->
        <div class="relative group">
            <div class="absolute -inset-1 bg-gradient-to-r from-cyan-400 to-blue-600 rounded-2xl blur opacity-25 group-hover:opacity-50 transition duration-1000"></div>
            <div id="konva-container" class="relative glass-panel rounded-xl overflow-hidden shadow-2xl aspect-square flex items-center justify-center bg-slate-900">
                <!-- Konva Stage will be injected here -->
                <div id="loading-text" class="absolute text-slate-500 animate-pulse">等待音频加载...</div>
            </div>
        </div>

        <!-- 右侧：控制面板 -->
        <div class="space-y-6">
            
            <!-- 文件上传区 -->
            <div class="glass-panel p-6 rounded-xl space-y-4">
                <label for="audio-upload" class="flex flex-col items-center justify-center w-full h-32 border-2 border-dashed border-slate-600 rounded-lg cursor-pointer hover:border-cyan-400 hover:bg-slate-800/50 transition-all group">
                    <div class="flex flex-col items-center justify-center pt-5 pb-6">
                        <svg class="w-8 h-8 mb-4 text-slate-400 group-hover:text-cyan-400 transition-colors" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 20 16">
                            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 13h3a3 3 0 0 0 0-6h-.025A5.56 5.56 0 0 0 16 6.5 5.5 5.5 0 0 0 5.207 5.021C5.137 5.017 5.071 5 5 5a4 4 0 0 0 0 8h2.167M10 15V6m0 0L8 8m2-2 2 2"/>
                        </svg>
                        <p class="mb-2 text-sm text-slate-400"><span class="font-semibold">点击上传 MP3</span> 或拖拽文件</p>
                        <p class="text-xs text-slate-500">支持 .mp3, .wav, .ogg</p>
                    </div>
                    <input id="audio-upload" type="file" accept="audio/*" />
                </label>
                <div id="file-name" class="text-center text-xs text-cyan-400 truncate h-4"></div>
            </div>

            <!-- 播放控制 -->
            <div class="glass-panel p-6 rounded-xl space-y-4">
                <div class="flex items-center justify-between">
                    <button id="play-btn" disabled class="w-12 h-12 rounded-full bg-slate-700 text-slate-400 flex items-center justify-center cursor-not-allowed transition-all hover:scale-105 disabled:opacity-50">
                        <svg id="play-icon" class="w-6 h-6 ml-1" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                        <svg id="pause-icon" class="w-6 h-6 hidden" fill="currentColor" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                    </button>
                    <div class="flex-1 mx-4">
                        <div class="h-2 bg-slate-700 rounded-full overflow-hidden">
                            <div id="progress-bar" class="h-full bg-gradient-to-r from-cyan-400 to-blue-500 w-0 transition-all duration-100 ease-linear"></div>
                        </div>
                        <div class="flex justify-between text-xs text-slate-400 mt-1">
                            <span id="current-time">00:00</span>
                            <span id="duration">00:00</span>
                        </div>
                    </div>
                </div>
                
                <!-- 音量可视化条 (装饰用) -->
                <div class="flex items-end justify-center space-x-1 h-12" id="visualizer-bars">
                    <!-- Bars generated by JS -->
                </div>
            </div>

            <!-- 说明 -->
            <div class="text-xs text-slate-500 leading-relaxed">
                <p>技术原理：</p>
                <ul class="list-disc list-inside mt-1 space-y-1">
                    <li>使用 <strong>Web Audio API</strong> 分析音频频率数据。</li>
                    <li>提取低频段能量作为“嘴巴张开度指标”。</li>
                    <li>使用 <strong>GSAP</strong> 平滑插值嘴巴形状，避免抖动。</li>
                    <li>使用 <strong>Konva</strong> 高性能渲染矢量图形。</li>
                </ul>
            </div>
        </div>
    </main>

    <script>
        // --- 配置与状态 ---
        const config = {
            mouthMinScale: 0.1, // 嘴巴最小闭合程度
            mouthMaxScale: 1.0, // 嘴巴最大张开程度
            smoothing: 0.1,     // GSAP 动画持续时间 (秒)，越小反应越快，越大越平滑
            sensitivity: 2.5    // 灵敏度系数
        };

        let state = {
            audioContext: null,
            analyser: null,
            source: null,
            audioBuffer: null,
            isPlaying: false,
            startTime: 0,
            pauseTime: 0,
            animationId: null,
            mouthOpenness: 0
        };

        // --- DOM 元素 ---
        const fileInput = document.getElementById('audio-upload');
        const fileNameDisplay = document.getElementById('file-name');
        const playBtn = document.getElementById('play-btn');
        const playIcon = document.getElementById('play-icon');
        const pauseIcon = document.getElementById('pause-icon');
        const progressBar = document.getElementById('progress-bar');
        const currentTimeEl = document.getElementById('current-time');
        const durationEl = document.getElementById('duration');
        const loadingText = document.getElementById('loading-text');
        const visualizerContainer = document.getElementById('visualizer-bars');

        // --- 初始化 Konva ---
        const width = 400;
        const height = 400;
        
        const stage = new Konva.Stage({
            container: 'konva-container',
            width: width,
            height: height,
        });

        const layer = new Konva.Layer();
        stage.add(layer);

        // 创建角色组
        const characterGroup = new Konva.Group({
            x: width / 2,
            y: height / 2,
        });
        layer.add(characterGroup);

        // 1. 头部背景
        const head = new Konva.Circle({
            radius: 120,
            fill: '#3b82f6', // blue-500
            stroke: '#60a5fa',
            strokeWidth: 4,
            shadowColor: 'black',
            shadowBlur: 20,
            shadowOpacity: 0.3
        });
        characterGroup.add(head);

        // 2. 眼睛 (左)
        const eyeLeft = new Konva.Group({ x: -40, y: -20 });
        eyeLeft.add(new Konva.Ellipse({ radiusX: 15, radiusY: 20, fill: 'white' }));
        eyeLeft.add(new Konva.Circle({ x: 2, y: 2, radius: 8, fill: 'black' }));
        characterGroup.add(eyeLeft);

        // 3. 眼睛 (右)
        const eyeRight = new Konva.Group({ x: 40, y: -20 });
        eyeRight.add(new Konva.Ellipse({ radiusX: 15, radiusY: 20, fill: 'white' }));
        eyeRight.add(new Konva.Circle({ x: 2, y: 2, radius: 8, fill: 'black' }));
        characterGroup.add(eyeRight);

        // 4. 嘴巴 (使用 Path 或 Shape 动态绘制)
        // 这里使用一个椭圆来模拟嘴巴开合，通过 scaleY 控制
        const mouth = new Konva.Ellipse({
            y: 40,
            radiusX: 25,
            radiusY: 5, // 初始高度
            fill: '#1e293b', // slate-800
            stroke: '#0f172a',
            strokeWidth: 2
        });
        characterGroup.add(mouth);

        // 初始化视觉化条形图
        for(let i=0; i<10; i++) {
            const bar = document.createElement('div');
            bar.className = 'w-2 bg-cyan-500 rounded-t-sm transition-all duration-75';
            bar.style.height = '5%';
            visualizerContainer.appendChild(bar);
        }
        const bars = Array.from(visualizerContainer.children);

        // --- 音频处理逻辑 ---

        function initAudioContext() {
            if (!state.audioContext) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                state.audioContext = new AudioContext();
                state.analyser = state.audioContext.createAnalyser();
                state.analyser.fftSize = 256; // 频率数据量
            }
        }

        function formatTime(seconds) {
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60);
            return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
        }


        // 文件上传处理
        fileInput.addEventListener('change', async (e) => {
            const file = e.target.files;
            if (!file) return;

            fileNameDisplay.textContent = file.name;
            loadingText.style.display = 'block';
            loadingText.textContent = "正在解码音频...";
            
            // 重置状态
            if (state.source) {
                state.source.stop();
                state.source.disconnect();
            }
            state.isPlaying = false;
            updatePlayButtonUI();

            initAudioContext();

            try {

                

                const arrayBuffer = await file[0].arrayBuffer();
                state.audioBuffer = await state.audioContext.decodeAudioData(arrayBuffer);
                
                loadingText.style.display = 'none';
                playBtn.disabled = false;
                playBtn.classList.remove('cursor-not-allowed', 'bg-slate-700', 'text-slate-400');
                playBtn.classList.add('bg-cyan-500', 'text-white', 'hover:bg-cyan-400');
                
                durationEl.textContent = formatTime(state.audioBuffer.duration);
                currentTimeEl.textContent = "00:00";
                progressBar.style.width = '0%';
                
            } catch (err) {
                console.error(err);
                loadingText.textContent = "音频解码失败";
                loadingText.classList.add('text-red-500');
            }
        });

        // 播放/暂停控制
        playBtn.addEventListener('click', () => {
            if (!state.audioBuffer) return;

            if (state.isPlaying) {
                pauseAudio();
            } else {
                playAudio();
            }
        });

        function playAudio() {
            if (state.audioContext.state === 'suspended') {
                state.audioContext.resume();
            }

            state.source = state.audioContext.createBufferSource();
            state.source.buffer = state.audioBuffer;
            
            // 连接分析器
            state.source.connect(state.analyser);
            state.analyser.connect(state.audioContext.destination);

            // 计算偏移量
            const offset = state.pauseTime || 0;
            state.startTime = state.audioContext.currentTime - offset;
            
            state.source.start(0, offset);
            state.isPlaying = true;
            
            state.source.onended = () => {
                if (state.isPlaying) { // 正常播放结束
                    state.pauseTime = 0;
                    state.isPlaying = false;
                    updatePlayButtonUI();
                    cancelAnimationFrame(state.animationId);
                    resetMouth();
                }
            };

            updatePlayButtonUI();
            animate();
        }

        function pauseAudio() {
            if (state.source) {
                state.source.stop();
                state.pauseTime = state.audioContext.currentTime - state.startTime;
                state.isPlaying = false;
                updatePlayButtonUI();
                cancelAnimationFrame(state.animationId);
            }
        }

        function updatePlayButtonUI() {
            if (state.isPlaying) {
                playIcon.classList.add('hidden');
                pauseIcon.classList.remove('hidden');
            } else {
                playIcon.classList.remove('hidden');
                pauseIcon.classList.add('hidden');
            }
        }

        function resetMouth() {
            gsap.to(mouth, {
                radiusY: config.mouthMinScale * 5, // 回到初始小高度
                duration: 0.5,
                ease: "power2.out"
            });
             // 重置进度条
             progressBar.style.width = '0%';
             currentTimeEl.textContent = "00:00";
        }

        // --- 核心动画循环 ---
        function animate() {
            if (!state.isPlaying) return;

            state.animationId = requestAnimationFrame(animate);

            // 1. 获取音频数据
            const bufferLength = state.analyser.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);
            state.analyser.getByteFrequencyData(dataArray);

            // 2. 计算音量/能量 (主要关注人声频段，通常在中低频)
            // 简单起见，取前 1/3 频段的平均值
            let sum = 0;
            const relevantBins = Math.floor(bufferLength / 3); 
            for (let i = 0; i < relevantBins; i++) {
                sum += dataArray[i];
            }
            const average = sum / relevantBins;

            // 3. 映射到嘴巴开合度
            // average 范围通常是 0-255
            // 我们需要一个阈值，低于阈值嘴巴闭合
            const threshold = 10; 
            let targetRadiusY = config.mouthMinScale * 5; // 基础闭合状态

            if (average > threshold) {
                // 归一化音量 (0 ~ 1)
                const normalizedVol = (average - threshold) / (255 - threshold);
                // 应用灵敏度
                const scaledVol = Math.min(normalizedVol * config.sensitivity, 1);
                
                // 计算目标半径 Y (基础半径 5, 最大张开半径 25)
                // 公式: min + (max - min) * scaledVol
                targetRadiusY = 5 + (25 - 5) * scaledVol;
            }

            // 4. 使用 GSAP 平滑过渡嘴巴形状
            // 直接修改 Konva 属性并触发重绘
            gsap.to(mouth, {
                radiusY: targetRadiusY,
                duration: config.smoothing,
                ease: "power1.out",
                onUpdate: () => {
                    // Konva 需要手动触发重绘如果属性改变
                    // 但 gsap 更新的是对象属性，Konva 的 shape 需要知道属性变了
                    // 更好的方式是直接 tween Konva 的属性，但 gsap 默认不知道 Konva
                    // 这里我们利用 gsap 的 onUpdate 手动设置 Konva 属性并重绘
                    // 或者更简单：gsap 直接 tween 一个普通对象，然后在 onUpdate 里赋值给 Konva
                }
            });
            
            // 修正：GSAP 不能直接 tween Konva 实例的内部属性并自动重绘，除非使用插件或手动调用
            // 更稳健的做法：
            gsap.killTweensOf(mouth); // 防止冲突
            gsap.to(mouth, {
                radiusY: targetRadiusY,
                duration: config.smoothing,
                ease: "power1.out",
                onUpdate: function() {
                    // 强制 Konva 重绘该层
                    layer.batchDraw();
                }
            });

            // 5. 更新 UI (进度条 & 视觉化)
            const currentTime = state.audioContext.currentTime - state.startTime;
            const duration = state.audioBuffer.duration;
            const percent = (currentTime / duration) * 100;
            
            progressBar.style.width = `${percent}%`;
            currentTimeEl.textContent = formatTime(currentTime);

            // 更新底部装饰性视觉条
            bars.forEach((bar, index) => {
                // 取不同频段的数据来驱动不同的条
                const dataIndex = Math.floor(index * (bufferLength / bars.length));
                const value = dataArray[dataIndex];
                const heightPercent = Math.max(5, (value / 255) * 100);
                bar.style.height = `${heightPercent}%`;
                // 颜色随音量变化
                if(value > 200) bar.className = 'w-2 bg-pink-500 rounded-t-sm transition-all duration-75';
                else if(value > 100) bar.className = 'w-2 bg-cyan-400 rounded-t-sm transition-all duration-75';
                else bar.className = 'w-2 bg-slate-600 rounded-t-sm transition-all duration-75';
            });
        }

        // 窗口大小调整适配
        window.addEventListener('resize', () => {
           // 可选：响应式调整 Stage 大小
        });

    </script>
</body>
</html>
