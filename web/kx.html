<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>Canvas 图片擦除示例</title>
    <style>
        body { display: flex; justify-content: center; align-items: center; height: 100vh; background: #f0f0f0; }
        canvas {
            border: 1px solid #ccc;
            background-color: transparent; /* 确保背景透明 */
            cursor: crosshair;
        }
    </style>
</head>
<body>

<canvas id="myCanvas" width="500" height="300"></canvas>

<script>
    const canvas = document.getElementById('myCanvas');
    const ctx = canvas.getContext('2d');
    let isDrawing = false;

    // 1. 加载图片并绘制到 Canvas
    const img = new Image();
    // 注意：如果图片跨域，需设置 crossOrigin 且服务端支持 CORS，否则无法导出
    img.crossOrigin = "Anonymous"; 
    img.src = 'http://127.0.0.1:8000/source/%E7%89%B9%E6%95%88/%E6%98%AF%E5%A4%9A%E5%B0%91/323.png'; 
    
    img.onload = function() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    };

    // 2. 获取坐标工具函数
    function getPos(e) {
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches.clientX : e.clientX;
        const clientY = e.touches ? e.touches.clientY : e.clientY;
        return {
            x: clientX - rect.left,
            y: clientY - rect.top
        };
    }

    // 3. 开始擦除
    function startDraw(e) {
        isDrawing = true;
        const pos = getPos(e);
        ctx.beginPath();
        ctx.moveTo(pos.x, pos.y);
    }

    // 4. 移动擦除（核心逻辑）
    function draw(e) {
        if (!isDrawing) return;
        e.preventDefault(); // 防止移动端滚动
        
        const pos = getPos(e);
        
        // 关键设置： destination-out 表示新绘制的图形会使目标图像变透明
        ctx.globalCompositeOperation = 'destination-out';
        
        ctx.lineWidth = 20;       // 橡皮擦大小
        ctx.lineCap = 'round';    // 圆头笔触
        ctx.lineJoin = 'round';
        
        ctx.lineTo(pos.x, pos.y);
        ctx.stroke();
    }

    // 5. 结束擦除
    function endDraw() {
        isDrawing = false;
        ctx.closePath();
        // 可选：恢复默认混合模式，以便后续进行其他非擦除绘制
        ctx.globalCompositeOperation = 'source-over';
    }

    // 绑定事件（兼容 PC 和移动端）
    canvas.addEventListener('mousedown', startDraw);
    canvas.addEventListener('mousemove', draw);
    canvas.addEventListener('mouseup', endDraw);
    canvas.addEventListener('mouseout', endDraw);

    canvas.addEventListener('touchstart', startDraw, { passive: false });
    canvas.addEventListener('touchmove', draw, { passive: false });
    canvas.addEventListener('touchend', endDraw);
</script>
</body>
</html>
