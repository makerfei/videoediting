<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
  <link rel="icon" href="gif/2.gif">
<title>简易骨骼动画</title>
<style>
  body { background: #1a1a2e; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
  canvas { background: #12122a; border-radius: 10px; }
</style>
</head>
<body>
<canvas id="c" width="500" height="400"></canvas>
<script>
const ctx = document.getElementById('c').getContext('2d');



// -------- 绘制骨骼 --------




// -------- 动画循环 --------
let t = 0;
function loop() {
  ctx.clearRect(0, 0, 500, 400);

  // 走路摆动（正弦波）
  const s = Math.sin(t * 5);
  const c = Math.cos(t * 5);

  lua.angle = lua.restAngle + s * 0.6;
  lfa.angle = lfa.restAngle + s * 0.3;

  rua.angle = rua.restAngle - s * 0.6;
  rfa.angle = rfa.restAngle - s * 0.3;

  lth.angle = lth.restAngle - s * 0.5;
  lsh.angle = lsh.restAngle - s * 0.4;

  rth.angle = rth.restAngle + s * 0.5;
  rsh.angle = rsh.restAngle + s * 0.4;

  drawAll(250, 250);
  t += 0.016;
  requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
