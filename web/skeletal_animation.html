<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Motion - 骨骼动作调节器</title>
    <script src="js/imagecompositing.js"></script>
    <link rel="icon" href="gif/2.gif">
    <style>
        :root {
            --bg-dark: #0f172a;
            --bg-panel: #1e293b;
            --border-color: #334155;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --accent: #38bdf8;
            --accent-hover: #0ea5e9;
            --highlight: #fbbf24;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* 布局结构 */
        header {
            height: 60px;
            background-color: var(--bg-panel);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            flex-shrink: 0;
        }

        .logo {
            font-weight: 700;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-icon {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, var(--accent), #3b82f6);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }

        .header-actions button {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s;
            margin-left: 10px;
        }

        .header-actions button:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .header-actions button.primary {
            background-color: var(--accent);
            border-color: var(--accent);
            color: white;
        }

        .header-actions button.primary:hover {
            background-color: var(--accent-hover);
        }

        main {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        /* 左侧边栏 */
        aside.left-sidebar {
            width: 260px;
            background-color: var(--bg-panel);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .panel-section {
            padding: 16px;
            border-bottom: 1px solid var(--border-color);
        }

        .panel-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-secondary);
            margin-bottom: 12px;
            font-weight: 600;
        }

        .preset-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .preset-item {
            padding: 10px;
            background-color: rgba(255, 255, 255, 0.03);
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: background 0.2s;
        }

        .preset-item:hover {
            background-color: rgba(255, 255, 255, 0.08);
        }

        .preset-item.active {
            background-color: rgba(56, 189, 248, 0.15);
            color: var(--accent);
        }

        .bone-tree {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
        }

        .bone-node {
            padding: 8px 12px;
            margin-bottom: 4px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9rem;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .bone-node:hover {
            background-color: rgba(255, 255, 255, 0.05);
            color: var(--text-primary);
        }

        .bone-node.active {
            background-color: rgba(56, 189, 248, 0.15);
            color: var(--accent);
        }

        /* 中间画布区 */
        .viewport {
            flex: 1;
            position: relative;
            background-color: #0b1120;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            display: flex;
            flex-direction: column;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .viewport-overlay {
            position: absolute;
            top: 16px;
            left: 16px;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(4px);
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            font-size: 0.8rem;
            color: var(--text-secondary);
            pointer-events: none;
        }

        .timeline {
            height: 140px;
            background-color: var(--bg-panel);
            border-top: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .timeline-controls {
            height: 36px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            padding: 0 16px;
            justify-content: space-between;
        }

        .timeline-track {
            flex: 1;
            position: relative;
            overflow-x: auto;
            padding: 20px 0;
        }

        .track-line {
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 2px;
            background-color: var(--border-color);
            transform: translateY(-50%);
        }

        .playhead {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 2px;
            background-color: var(--accent);
            left: 20%;
            z-index: 10;
            box-shadow: 0 0 10px var(--accent);
        }

        .keyframe {
            position: absolute;
            top: 50%;
            width: 10px;
            height: 10px;
            background-color: var(--highlight);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            cursor: pointer;
        }

        /* 右侧属性面板 */
        aside.right-sidebar {
            width: 300px;
            background-color: var(--bg-panel);
            border-left: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            overflow-y: auto;
        }

        .property-group {
            padding: 20px;
            border-bottom: 1px solid var(--border-color);
        }

        .control-row {
            margin-bottom: 16px;
        }

        .control-label {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .control-value {
            color: var(--accent);
            font-family: monospace;
        }

        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 4px;
            background: var(--border-color);
            border-radius: 2px;
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            background: var(--accent);
            border-radius: 50%;
            cursor: pointer;
            transition: transform 0.1s;
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        .toggle-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .toggle-switch {
            width: 40px;
            height: 22px;
            background-color: var(--border-color);
            border-radius: 11px;
            position: relative;
            cursor: pointer;
            transition: background 0.3s;
        }

        .toggle-switch.active {
            background-color: var(--accent);
        }

        .toggle-knob {
            position: absolute;
            top: 3px;
            left: 3px;
            width: 16px;
            height: 16px;
            background-color: white;
            border-radius: 50%;
            transition: transform 0.3s;
        }

        .toggle-switch.active .toggle-knob {
            transform: translateX(18px);
        }

        /* 响应式调整 */
        @media (max-width: 1024px) {
            aside.left-sidebar {
                width: 220px;
            }

            aside.right-sidebar {
                width: 260px;
            }
        }

        #filename {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 14px;
            color: #1f2937;
            background-color: #fff;
            transition: all 0.2s ease;
            outline: none;
            box-sizing: border-box;
        }

        .mybutt {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 4px;
        }

        .del {
            background-color: #ef4444;
            color: white;
        }
    </style>
</head>

<body>

    <header>
        <div class="logo">
            <div class="logo-icon">🦴</div>
            <span>Pro Motion</span>
        </div>
        <div class="header-actions">
            <button onclick="app.resetPose()">重置姿态</button>
            <button onclick="app.exportData()">导出 JSON</button>
            <button class="primary" onclick="app.play()">▶ 播放预览</button>
        </div>
    </header>

    <main>
        <!-- 左侧：层级与预设 -->
        <aside class="left-sidebar">
            <div class="panel-section">
                <div class="panel-title">动作预设库</div>
                <div id="actionList" class="preset-list">


                </div>
            </div>

            <div class="panel-title" style="padding: 16px 16px 0;">骨骼层级</div>
            <div class="bone-tree" id="bone-tree">
                <!-- JS 动态生成 -->
            </div>
        </aside>

        <!-- 中间：可视化视窗 -->
        <section class="viewport">
            <div class="viewport-overlay">
                <div>FPS: <span id="fps-counter">60</span></div>
                <div>Nodes: 12</div>
            </div>
            <img id="motionCanvas"></img>

            <!-- 底部时间轴 -->
            <div class="timeline">
                <div class="timeline-controls">
                    <div style="font-size: 0.8rem; color: var(--text-secondary);">
                        <span id="playtime">00:00</span>
                        <span style="margin: 0 10px;">|</span>
                        <span id="allkeyLong">0</span>
                    </div>
                    <div style="display: flex; gap: 10px;">
                        <button
                            style="background:none; border:none; color:var(--text-secondary); cursor:pointer;">◀</button>
                        <button
                            style="background:none; border:none; color:var(--text-secondary); cursor:pointer;">+</button>
                    </div>
                </div>
                <div class="timeline-track">
                    <div class="track-line"></div>
                    <div id="playhead" class="playhead" style="left: 00%;"></div>
                    <div id="keylist"></div>



                </div>
            </div>
        </section>

        <!-- 右侧：属性调节面板 -->
        <aside class="right-sidebar">
            <div class="property-group">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 4px;">
                    <h3 id="selected-bone-name" style="font-size: 1rem;">Root Node</h3>
                    <span
                        style="font-size: 0.7rem; background: rgba(56, 189, 248, 0.1); color: var(--accent); padding: 2px 6px; border-radius: 4px;">FK
                        Mode</span>
                </div>
                <p style="font-size: 0.8rem; color: var(--text-secondary); margin-top: 4px;">调整局部旋转角度以改变姿态</p>
            </div>

            <div class="property-group" id="controls-container">
                <div class="control-row">
                    <div class="control-label">
                        <span>rotation</span>
                        <span class="control-value" id="val-rot">0°</span>
                    </div>
                    <input type="range" min="-90" max="90" value="0" id="slider-rot">
                </div>

                <div class="control-row">
                    <div class="control-label">
                        <span>x</span>
                        <span class="control-value" id="val-x">0</span>
                    </div>
                    <input type="range" min="-50" max="50" step="1" value="0" id="slider-x">
                </div>

                <div class="control-row">
                    <div class="control-label">
                        <span>y</span>
                        <span class="control-value" id="val-y">0</span>
                    </div>
                    <input type="range" min="-50" max="50" step="1" value="0" id="slider-y">
                </div>
            </div>

            <div class="property-group">
                <div class="panel-title">姿态名称</div>
                <input id="filename" value="" placeholder="请输入姿态名称" />
                <div class="panel-title"></div>
                <button class="mybutt" onclick="app.addAction()">确定</button>
                <div class="panel-title"></div>
                <button class="del mybutt" onclick="app.delAction()">删除</button>
            </div>

            <div style="padding: 20px; margin-top: auto;">
                <button onclick="app.addkey()"
                    style="width: 100%; padding: 10px; background: var(--bg-dark); border: 1px solid var(--border-color); color: var(--text-secondary); border-radius: 6px; cursor: pointer; font-size: 0.85rem;"
                    onmouseover="this.style.borderColor='var(--accent)'"
                    onmouseout="this.style.borderColor='var(--border-color)'">
                    添加关键帧 (K)
                </button>
            </div>
        </aside>
    </main>

    <script>
        /**
         * 简易 2D 骨骼引擎与 UI 控制器
         * 纯原生 JS 实现，无外部依赖
         */
        const app = {
            canvas: null,
            ctx: null,
            width: 0,
            height: 0,
            bones: [],
            selectedBoneId: '',
            selectedaction: '',
            animationFrame: null,
            allBones: ["身体", "头", "表情", "头发", "左上臂", "左下臂", "左手", "右上臂", "右下臂", "右手", "左大腿", "左小腿", "左脚", "右大腿", "右小腿", "右脚"],

            allBonesList: {}, //root:{rotation:12,x:10,y:10}
            action: [
                // {name:"",Bones:{root:{rotation:12,x:10,y:10}}}
            ],
            images: null,
            filename: "",
            keyList: [],
            timeTime: 0,
            isplay: false,

            // 初始化
            async init() {
                this.canvas = document.getElementById('motionCanvas');
                this.resize();
                window.addEventListener('resize', () => this.resize());
                this.loadFromLocalStorage()
                this.initBones();

                await this.reloadMove()
                this.renderBoneTree();
                this.renderAction()
                this.setupControls();

                // 默认选中 Root
                this.selectBone('身体');
            },

            loadFromLocalStorage() {
                const data = localStorage.getItem('annotatePro_data_v2');
                if (data) {
                    let { filename, images } = JSON.parse(data);
                    this.images = images;
                    this.filename = filename;
                }
                const action = localStorage.getItem('action');
                if (action) {
                    this.action = JSON.parse(action)
                }
            },

            // 本地持久化
            saveToLocalStorage() {
                try {
                    localStorage.setItem('action', JSON.stringify(this.action));
                } catch (e) {
                    console.warn('LocalStorage 空间不足，仅会话有效');
                }
            },


            // 重新加载骨骼图
            async reloadMove() {
                let PromiseList = []
                this.images.forEach(item => {
                    let p = new Promise((resolve, reject) => {
                        item.img = new Image()
                        item.img.onload = () => {
                            resolve()
                        }
                        item.img.src = item.src
                    })
                    PromiseList.push(p)

                })
                await Promise.all(PromiseList)
                let images = []
                this.images.forEach(item => {
                    if (this.allBonesList[item.name]) {
                        images.push({
                            ...item,
                            rotation: this.allBonesList[item.name].rotation,
                            offsetX: this.allBonesList[item.name].x,
                            offsetY: this.allBonesList[item.name].y
                        })
                    }
                })
                this.canvas.setAttribute("src", getimage(this.width, this.height, 0, 0, images,returnTpe="base64"))
            },

            resize() {
                const container = document.querySelector('.viewport');
                // 减去时间轴高度
                this.width = container.clientWidth;
                this.height = container.clientHeight - 140;
                this.canvas.width = this.width;
                this.canvas.height = this.height;
            },

            // 定义骨骼结构
            initBones() {
                this.allBonesList = {}
                this.allBones.forEach(BoneName => {
                    this.allBonesList[BoneName] = { rotation: 0, x: 0, y: 0 }
                })
            },

            renderBoneTree() {
                const tree = document.getElementById('bone-tree');
                tree.innerHTML = '';
                this.allBones.forEach(bone => {
                    const div = document.createElement('div');
                    div.className = `bone-node ${this.selectedBoneId === bone ? 'active' : ''}`;
                    div.innerHTML = `<i class="fa-solid fa-circle-nodes" style="font-size:10px"></i> ${bone}`;
                    div.onclick = () => this.selectBone(bone);
                    tree.appendChild(div);
                });
            },

            selectBone(bone) {
                this.selectedBoneId = bone;

                document.getElementById('selected-bone-name').innerText = bone;
                this.renderBoneTree(); // 更新高亮

                // 更新滑块值
                const sliderRot = document.getElementById('slider-rot');
                const deg = this.allBonesList[bone].rotation;
                sliderRot.value = deg / Math.PI * 180;
                document.getElementById('val-rot').innerText = deg / Math.PI * 180 + '°';

                const sliderx = document.getElementById('slider-x');
                const x = this.allBonesList[bone].x;
                sliderx.value = x;
                document.getElementById('val-x').innerText = x;

                const slidery = document.getElementById('slider-y');
                const y = this.allBonesList[bone].y;
                slidery.value = y;
                document.getElementById('val-y').innerText = y;

            },
            setupControls() {
                const sliderRot = document.getElementById('slider-rot');
                sliderRot.addEventListener('input', (e) => {
                    const val = parseFloat(e.target.value);
                    this.allBonesList[this.selectedBoneId].rotation = val / 180 * Math.PI;
                    document.getElementById('val-rot').innerText = val + '°';
                    this.reloadMove()
                });
                const sliderx = document.getElementById('slider-x');
                sliderx.addEventListener('input', (e) => {
                    document.getElementById('val-x').innerText = e.target.value;
                    this.allBonesList[this.selectedBoneId].x = e.target.value;
                    this.reloadMove()
                });

                const slidery = document.getElementById('slider-y');
                slidery.addEventListener('input', (e) => {
                    document.getElementById('val-y').innerText = e.target.value;
                    this.allBonesList[this.selectedBoneId].y = e.target.value;
                    this.reloadMove()
                });
            },


            // 添加或修改姿态
            addAction() {

                let filename = document.getElementById("filename").value

                let forget = this.action.find(i => i.name == filename)

                if (forget) {
                    forget.Bones = structuredClone(this.allBonesList)
                } else {
                    this.action.push({
                        name: filename,
                        Bones: structuredClone(this.allBonesList)
                    })
                }
                this.renderAction()
                this.saveToLocalStorage()
            },
            delAction() {
                let filename = document.getElementById("filename").value
                this.action = this.action.filter(i => i.name !== filename)
                this.renderAction()
                this.saveToLocalStorage()
            },
            renderAction() {
                let actionList = document.getElementById("actionList")

                actionList.innerHTML = ""
                this.action.forEach(item => {
                    let t = document.createElement("div")

                    t.className = this.selectedaction == item.name ? "preset-item active" : "preset-item"

                    t.innerText = item.name
                    t.onclick = () => { this.selectedactionClick(item.name) }
                    actionList.append(t)
                })


            },


            addkey() {
                this.keyList.push(this.selectedaction)
                this.renderKeyList()

            },
            renderKeyList() {
                let keylist = document.getElementById("keylist")
                keylist.innerHTML = ""
                let long = this.keyList.length

                document.getElementById("allkeyLong").innerText = long


                this.keyList.forEach((item, i) => {
                    let d = document.createElement("div")
                    d.className = "keyframe"
                    d.style = `left: ${(i) * 10}%`
                    d.innerText = item
                    keylist.append(d)
                })
            },
            play() {
                if (this.isplay) {
                    this.isplay = false
                } else {
                    this.isplay = true
                    this.timeTime = new Date().getTime()
                    this.loop()
                }


            },
            loop() {
                let time = (new Date().getTime() - this.timeTime)*2;
                document.getElementById("playtime").innerText =Number(time / 1000).toFixed(3) 
                document.getElementById("playhead").style = `left: ${time / 100}%;`

                let startKeyIndex = Math.floor(time / 1000)
                let endKeyIndex = startKeyIndex + 1;
                let keyTime = (time / 1000 - startKeyIndex);

                if (startKeyIndex >= this.keyList.length-1) {
                    this.timeTime = new Date().getTime()

                } else {
                    let startaction = this.action.find(i => i.name == this.keyList[startKeyIndex])
                    let endaction = this.action.find(i => i.name == this.keyList[endKeyIndex])


                    this.allBones.forEach(BoneName => {
                        let rotation = endaction.Bones[BoneName].rotation * keyTime + (1 - keyTime) * startaction.Bones[BoneName].rotation
                        let x = endaction.Bones[BoneName].x * keyTime + (1 - keyTime) * startaction.Bones[BoneName].x
                        let y = endaction.Bones[BoneName].y * keyTime + (1 - keyTime) * startaction.Bones[BoneName].y
                        this.allBonesList[BoneName] = { rotation, x, y }
                    })

                    this.reloadMove()
                }



                if (this.isplay) {
                    requestAnimationFrame(() => this.loop());
                }

            },

            resetPose() {
                this.initBones()
                this.selectBone('身体');
                this.reloadMove()
            },

            selectedactionClick(name) {
                document.getElementById("filename").value = name
                let forget = this.action.find(i => i.name == name)
                this.allBonesList = structuredClone(forget.Bones)
                this.selectedaction = name
                this.selectBone(this.selectedBoneId);
                this.renderAction()
                this.reloadMove()
            },

            exportData() {

            }
        };

        // 启动应用
        window.onload = () => app.init();
    </script>
</body>

</html>
