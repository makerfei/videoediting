<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FaceConfig 参数调节器</title>
    <style>
        :root {
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --bg-body: #f8fafc;
            --bg-panel: #ffffff;
            --text-main: #1e293b;
            --text-sub: #64748b;
            --border: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Header */
        header {
            background: var(--bg-panel);
            border-bottom: 1px solid var(--border);
            padding: 0 1.5rem;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
            z-index: 10;
        }

        .brand {
            font-weight: 700;
            font-size: 1.25rem;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .actions {
            display: flex;
            gap: 0.75rem;
        }

        button {
            padding: 0.5rem 1rem;
            border-radius: 0.375rem;
            border: 1px solid transparent;
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-secondary {
            background: #f1f5f9;
            color: var(--text-sub);
            border-color: var(--border);
        }

        .btn-secondary:hover {
            background: #e2e8f0;
            color: var(--text-main);
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-hover);
        }

        /* Main Layout */
        main {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        /* Sidebar Controls */
        aside {
            width: 320px;
            background: var(--bg-panel);
            border-right: 1px solid var(--border);
            overflow-y: auto;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        .control-group {
            margin-bottom: 1rem;
        }

        .section-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #94a3b8;
            font-weight: 600;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .input-row {
            margin-bottom: 0.75rem;
        }

        label {
            display: block;
            font-size: 0.875rem;
            color: var(--text-main);
            margin-bottom: 0.25rem;
            font-weight: 500;
        }

        .label-flex {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .val-display {
            font-size: 0.75rem;
            color: var(--text-sub);
            font-family: monospace;
        }

        input[type="range"] {
            width: 100%;
            height: 4px;
            background: #e2e8f0;
            border-radius: 2px;
            appearance: none;
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            appearance: none;
            width: 16px;
            height: 16px;
            background: var(--primary);
            border-radius: 50%;
            cursor: pointer;
            transition: transform 0.1s;
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        input[type="color"] {
            width: 100%;
            height: 36px;
            border: 1px solid var(--border);
            border-radius: 0.375rem;
            padding: 2px;
            cursor: pointer;
            background: white;
        }

        input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: var(--primary);
        }

        .toggle-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.75rem;
            background: #f8fafc;
            border-radius: 0.5rem;
            border: 1px solid var(--border);
        }

        /* Preview Area */
        .preview-area {
            flex: 1;
            background-color: #f1f5f9;
            background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
            background-size: 20px 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 2rem;
        }

        .img-container {
            position: relative;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            border-radius: 1rem;
            background: white;
            padding: 1rem;
            transition: transform 0.3s ease;
        }

        #previewImage {
            max-width: 100%;
            max-height: 70vh;
            display: block;
            border-radius: 0.5rem;
        }

        .overlay-info {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(4px);
            padding: 0.75rem;
            border-radius: 0.5rem;
            border: 1px solid var(--border);
            font-size: 0.875rem;
            color: var(--text-sub);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 50;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal {
            background: white;
            width: 90%;
            max-width: 600px;
            border-radius: 0.75rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            transform: scale(0.95);
            transition: transform 0.3s;
            display: flex;
            flex-direction: column;
            max-height: 80vh;
        }

        .modal-overlay.active .modal {
            transform: scale(1);
        }

        .modal-header {
            padding: 1rem 1.5rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-title {
            font-weight: 600;
            font-size: 1.125rem;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 1.5rem;
            color: var(--text-sub);
            cursor: pointer;
            padding: 0;
            line-height: 1;
        }

        .modal-body {
            padding: 1.5rem;
            flex: 1;
            overflow: auto;
        }

        textarea {
            width: 100%;
            height: 300px;
            padding: 1rem;
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            font-family: monospace;
            font-size: 0.875rem;
            resize: none;
            background: #f8fafc;
        }

        .modal-footer {
            padding: 1rem 1.5rem;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: flex-end;
        }

        /* Responsive */
        @media (max-width: 768px) {
            main {
                flex-direction: column;
            }

            aside {
                width: 100%;
                height: 40%;
                border-right: none;
                border-bottom: 1px solid var(--border);
            }

            .preview-area {
                height: 60%;
            }
        }
    </style>
    <script src="js/face.js"></script>
</head>

<body>

    <header>
        <div class="brand">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="8" x2="12" y2="12"></line>
                <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
            FaceConfig Editor
        </div>
        <div class="actions">
            <button class="btn-secondary" id="btn-reset">重置</button>
            <button class="btn-primary" id="btn-export">导出 JSON</button>
        </div>
    </header>

    <main>
        <aside id="controls">
            <!-- Controls will be injected by JS -->
        </aside>

        <section class="preview-area">
            <div class="img-container" id="imgContainer">
                <img id="previewImage" alt="空白表情占位图，用于展示面部参数调节效果">
            </div>
            <div class="overlay-info">
                <div style="font-weight: 600; color: var(--text-main); margin-bottom: 4px;">状态</div>
                <div id="status-text">就绪</div>
            </div>
        </section>
    </main>

    <!-- Export Modal -->
    <div class="modal-overlay" id="exportModal">
        <div class="modal">
            <div class="modal-header">
                <span class="modal-title">导出配置</span>
                <button class="close-btn" id="closeModal">&times;</button>
            </div>
            <div class="modal-body">
                <textarea id="jsonOutput" readonly></textarea>
            </div>
            <div class="modal-footer">
                <button class="btn-primary" id="copyJson">复制到剪贴板</button>
            </div>
        </div>
    </div>

    <script>
        // Default Configuration
        const defaultConfig = {
            scale: 1,
            skinColor: '#f5d0b5',
            shadowColor: 'rgba(0,0,0,0.1)',
          
            happy: 0, angry: 0, sad: 0, surprised: 0,

            viewAngle: 0,


            faceWidthAdd: 0,
            MassAdd: 0,
            topYAdd: 0,
            chinYAdd: 0,
            browXAdd: 0,
            browYAdd: 0,
            browColor: "#000000",
            browlongAdd: 0,
            browWidthAdd: 0,
            eyeXadd: 0,
            eyeYadd: 0,
            eyeHeightAdd: 0,
            eyeWidthAdd: 0,
            eyeColor1: "#fff",
            eyeColor2: "#000",
            eyeColor3: "#fff",
            eyeSizeAdd: 2,
            noseWidthAdd: 0,
            noseColor: 'rgba(100, 80, 70, 0.3)',
            noseYAdd: 0,
            noseLongAdd: 30,
            noseColor2: 'rgba(0,0,0,0.05)',
            mouthColor1: "#e5b28f",
            mouthlineWidthAdd: 0,
            mouthWidthAdd: 0,
            mouthYAdd: 0,
            mouthColor2: '#c4694a',
            isSpeak: false,
            SpeakValue: 0,
        };

        let currentConfig = JSON.parse(JSON.stringify(defaultConfig));

        // Control Definitions for UI Generation
        const controlDefs = [
            { section: '基础与脸型', icon: '📐' },
            { key: 'skinColor', label: '肤色', type: 'color' },
            { key: 'scale', label: '缩放 (Scale)', type: 'range', min: 0.5, max: 2, step: 0.1 },

            { key: 'happy', label: 'happy', step: 0.1, type: 'range', min: 0, max: 1 },
            { key: 'angry', label: 'angry', step: 0.1, type: 'range', min: 0, max: 1 },
            { key: 'sad', label: 'sad', step: 0.1, type: 'range', min: 0, max: 1 },
            { key: 'surprised', label: 'surprised', step: 0.1, type: 'range', min: 0, max: 1 },

            { key: 'viewAngle', label: '角度', type: 'range', min: -50, max: 50 },

            { key: 'faceWidthAdd', label: '脸宽调整', type: 'range', min: -50, max: 50 },
            { key: 'MassAdd', label: '胖瘦系数', type: 'range', step: 0.1, min: -0.5, max: 0.5 },
            { key: 'topYAdd', label: '头顶高度', type: 'range', min: -50, max: 50 },
            { key: 'chinYAdd', label: '下巴高度', type: 'range', min: -50, max: 50 },

            { section: '眼睛', icon: '👁️' },
            { key: 'eyeColor1', label: '眼白颜色', type: 'color' },
            { key: 'eyeColor2', label: '瞳孔颜色', type: 'color' },
            { key: 'eyeColor3', label: '瞳孔内颜色', type: 'color' },
            { key: 'eyeXadd', label: '眼睛间距 (X)', type: 'range', min: -30, max: 30 },
            { key: 'eyeYadd', label: '眼睛位置 (Y)', type: 'range', min: -30, max: 30 },
            { key: 'eyeWidthAdd', label: '眼睛宽度', type: 'range', min: -20, max: 20 },
            { key: 'eyeHeightAdd', label: '眼睛高度', type: 'range', min: -20, max: 20 },
            { key: 'eyeSizeAdd', label: '眼睛尺寸系数', type: 'range', min: 0, max: 10, step: 0.5 },

            { section: '眉毛', icon: '🤨' },
            { key: 'browColor', label: '眉毛颜色', type: 'color' },
            { key: 'browXAdd', label: '眉毛间距', type: 'range', min: -30, max: 30 },
            { key: 'browYAdd', label: '眉毛位置 (Y)', type: 'range', min: -30, max: 30 },
            { key: 'browlongAdd', label: '眉毛长度', type: 'range', min: -20, max: 20 },
            { key: 'browWidthAdd', label: '眉毛宽度', type: 'range', min: -5, max: 10 },

            { section: '鼻子', icon: '👃' },
            { key: 'noseLongAdd', label: '鼻子长度', type: 'range', min: 0, max: 60 },
            { key: 'noseWidthAdd', label: '鼻子宽度', type: 'range', min: -20, max: 20 },
            { key: 'noseYAdd', label: '鼻子位置 (Y)', type: 'range', min: -20, max: 20 },

            { section: '嘴巴', icon: '👄' },
            { key: 'mouthColor1', label: '唇色', type: 'color' },
            { key: 'mouthColor2', label: '内线颜色', type: 'color' },
            { key: 'mouthWidthAdd', label: '嘴巴宽度', type: 'range', min: -30, max: 30 },
            { key: 'mouthYAdd', label: '嘴巴位置 (Y)', type: 'range', min: -30, max: 30 },
            { key: 'mouthlineWidthAdd', label: '嘴线宽度', type: 'range', min: 0, max: 10 },
            { key: 'isSpeak', label: '说话动画', type: 'toggle' },
            { key: 'SpeakValue', label: '张嘴幅度', type: 'range', step: 0.1, min: 0, max: 1, disabled: true }
        ];

        const controlsContainer = document.getElementById('controls');
        const previewImage = document.getElementById('previewImage');
        const imgContainer = document.getElementById('imgContainer');
        const statusText = document.getElementById('status-text');

        // Generate UI
        function initUI() {
            controlDefs.forEach(def => {
                if (def.section) {
                    const title = document.createElement('div');
                    title.className = 'section-title';
                    title.innerHTML = `<span>${def.icon}</span> ${def.section}`;
                    controlsContainer.appendChild(title);
                    return;
                }

                const group = document.createElement('div');
                group.className = 'input-row';

                const label = document.createElement('label');
                label.className = def.type === 'toggle' ? '' : 'label-flex';
                label.textContent = def.label;

                let input;
                let valDisplay;

                if (def.type === 'color') {
                    input = document.createElement('input');
                    input.type = 'color';
                    input.value = currentConfig[def.key];
                    input.id = `input-${def.key}`;

                    // Simple value display for color hex
                    valDisplay = document.createElement('span');
                    valDisplay.className = 'val-display';
                    valDisplay.textContent = currentConfig[def.key];
                    label.appendChild(valDisplay);
                } else if (def.type === 'toggle') {
                    const row = document.createElement('div');
                    row.className = 'toggle-row';

                    const textSpan = document.createElement('span');
                    textSpan.textContent = def.label;

                    input = document.createElement('input');
                    input.type = 'checkbox';
                    input.checked = currentConfig[def.key];
                    input.id = `input-${def.key}`;

                    row.appendChild(textSpan);
                    row.appendChild(input);
                    group.appendChild(row);
                    controlsContainer.appendChild(group);

                    // Special listener for toggle to enable/disable SpeakValue
                    input.addEventListener('change', (e) => {
                        currentConfig[def.key] = e.target.checked;
                        const speakInput = document.getElementById('input-SpeakValue');
                        const speakLabel = document.getElementById('label-SpeakValue');
                        if (e.target.checked) {
                            speakInput.disabled = false;
                            speakLabel.style.opacity = '1';
                        } else {
                            speakInput.disabled = true;
                            speakInput.value = 0;
                            currentConfig.SpeakValue = 0;
                            document.getElementById('val-SpeakValue').textContent = '0';
                            speakLabel.style.opacity = '0.5';
                        }
                        updatePreview();
                    });
                    return; // Skip standard append
                } else {
                    // Range slider
                    valDisplay = document.createElement('span');
                    valDisplay.className = 'val-display';
                    valDisplay.id = `val-${def.key}`;
                    valDisplay.textContent = currentConfig[def.key];
                    label.appendChild(valDisplay);

                    input = document.createElement('input');
                    input.type = 'range';
                    input.min = def.min;
                    input.max = def.max;
                    input.step = def.step || 1;
                    input.value = currentConfig[def.key];
                    input.id = `input-${def.key}`;
                    if (def.disabled) {
                        input.disabled = true;
                        label.style.opacity = '0.5';
                        label.id = `label-${def.key}`;
                    }
                }

                group.appendChild(label);
                if (def.type !== 'toggle') {
                    group.appendChild(input);
                }
                controlsContainer.appendChild(group);

                // Event Listener
                input.addEventListener('input', (e) => {
                    const val = def.type === 'color' ? e.target.value : parseFloat(e.target.value);
                    currentConfig[def.key] = val;
                    if (valDisplay) valDisplay.textContent = val;
                    updatePreview();
                });
            });
        }

        // Update Preview Logic
        function updatePreview() {
            // Apply Scale


            // Apply Speaking Animation
            if (currentConfig.isSpeak && currentConfig.SpeakValue > 0) {
                const pulse = 1 + (currentConfig.SpeakValue / 200); // Subtle pulse

                statusText.textContent = `说话中: ${currentConfig.SpeakValue}%`;
                statusText.style.color = '#3b82f6';
            } else {

                statusText.textContent = '参数已更新';
                statusText.style.color = '#64748b';
            }



            document.getElementById("previewImage").src = new Face(currentConfig).getBase64()



            // Note: Since we are not drawing, other params like eyeXadd don't visually change the placeholder image,
            // but they are updated in the currentConfig object ready for export.
        }

        // Reset Function
        document.getElementById('btn-reset').addEventListener('click', () => {
            currentConfig = JSON.parse(JSON.stringify(defaultConfig));

            // Reset UI inputs
            controlDefs.forEach(def => {
                if (def.key) {
                    const input = document.getElementById(`input-${def.key}`);
                    const valDisplay = document.getElementById(`val-${def.key}`);
                    const val = defaultConfig[def.key];

                    if (def.type === 'toggle') {
                        input.checked = val;
                        // Trigger change manually to reset dependent fields
                        input.dispatchEvent(new Event('change'));
                    } else {
                        input.value = val;
                        if (valDisplay) valDisplay.textContent = val;
                        currentConfig[def.key] = val;
                    }
                }
            });
            updatePreview();
        });

        // Export Modal Logic
        const modal = document.getElementById('exportModal');
        const jsonOutput = document.getElementById('jsonOutput');

        document.getElementById('btn-export').addEventListener('click', () => {
            const exportData = {
                ...currentConfig
            };
            jsonOutput.value = JSON.stringify(exportData, null, 4);
            modal.classList.add('active');
        });

        document.getElementById('closeModal').addEventListener('click', () => {
            modal.classList.remove('active');
        });

        modal.addEventListener('click', (e) => {
            if (e.target === modal) modal.classList.remove('active');
        });

        document.getElementById('copyJson').addEventListener('click', () => {
            jsonOutput.select();
            document.execCommand('copy');
            const btn = document.getElementById('copyJson');
            const originalText = btn.textContent;
            btn.textContent = '已复制!';
            setTimeout(() => {
                btn.textContent = originalText;
            }, 2000);
        });

        // Initialize
        initUI();
        updatePreview();

    </script>
</body>

</html>
