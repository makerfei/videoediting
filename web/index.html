<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <link rel="icon" href="icon.gif">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>视频剪辑时间线 + 实时预览</title>
  <link href="css/style.css" rel="stylesheet" type="text/css">
  </link>
  <script src="js/cnd/axios.min.js"></script>
  <script src="js/cnd/konva.min.js"></script>
  <script src="js/cnd/gsap.min.js"></script>
  <script src="js/face.js"></script>
</head>

<body>
  <!-- 顶部工具栏 -->
  <div class="toolbar">

    <div id="typeUI"> </div>

    <div style="flex:1"></div>
    <span class="time-display" id="time-display">00:00.0</span>
    <button class="btn" onclick="zoomTimeline(-10)">🔍-</button>
    <span class="zoom-display" id="zoom-level">100%</span>
    <button class="btn" onclick="zoomTimeline(10)">🔍+</button>

    <button class="btn btn-primary" id="exportBtnVideo">📥 导出视频</button>
    <input type="file" id="import-file" style="display:none" onchange="importData(this)" accept=".json">
    <button class="btn" onclick="document.getElementById('import-file').click()">📤 导入</button>
  </div>
  <!-- 主布局 -->
  <div class="main-layout">
    <!-- 视频预览区 -->
    <div class="preview-section" id="preview-section">
      <!-- 图片文件选择点击区 -->
      <div class="imgselect">
        <div id="categorizationListUI"></div>
        <div id="fillListUI"></div>
      </div>



      <!-- 视频播放区 -->
     
        <div class="preview-placeholder">
          <div id="preview-placeholder"></div>
        </div>
    


      <div id="sound">
        <div>
          <textarea id="soundInput"></textarea>
          <div class="soundSumbitPart"><button id="soundSumbit">确定</button></div>
        </div>

        <div id="soundList"></div>
      </div>

      <div class="altcon hide" id="altcon">

        <!-- konva内容属性 -->
        <div id="rebuildTimeline" class="rebuildTimeline">
          <div>
            <div>
              <span id="addkeyFrame" class="btn-modern">插帧</span>
              <span id="setkeyFrameStartAndEnd" class="btn-modern">设置首尾</span>
            </div>
            <div class="timelist" id="keyframelist">
            </div>
          </div>
        </div>
        <div id="showtimedata" class="showtimedata">
          <pre id="json-preview">
        </pre>
        </div>
      </div>





    </div>

    <!-- 播放控制栏 -->
    <div class="playback-bar">
      <button class="play-btn paused" id="play-btn" onclick="togglePlay()" title="播放/暂停 (空格键)"></button>
     
      <input type="text" id="trackInputId" class="playbackinput" />
      <button class="btn" onclick="changeTrackId()">修改轨道ID</button>
      <button class="btn" onclick="addTrack('video')">📹 视频轨道</button>
      <button class="btn" onclick="addTrack('audio')">🎵 音频轨道</button>
      <button class="btn" onclick="addTrack('action')">🏃‍♂️ 动作轨道</button>
      <button class="btn" onclick="addTrack('face')">🫥 表情轨道</button>
      <button class="btn" onclick="addTrack('scale')">🔎 缩放</button>
      <button class="btn" onclick="addTrack('show')">📚 显示图层</button>

      <input type="text" class="playbackinput" id="fillName" />
      <button class="btn btn-primary" onclick="saveCurrentWorkspaceClick()">保存</button>

      <div style="flex:1"></div>
      <span style="font-size:12px; color:#666;">当前时间: </span>
      <span class="time-display" id="current-time">00:00.0</span>
      <span style="color:#444; margin:0 6px;">/</span>
      <span class="time-display" id="total-time">00:00.0</span>
    </div>

    <!-- 时间线区域 -->
    <div class="timeline-section">
      <div class="scroll-container" id="scroll-container">
        <div class="ruler" id="ruler"></div>
        <div class="tracks-container" id="tracks-container">
          <!-- 轨道在此动态渲染 -->
        </div>
        <div class="playhead" id="playhead" style="left: 0px;">
          <div class="playhead-handle" id="playhead-handle"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- 右键菜单 -->
  <div class="context-menu" id="context-menu">
    <div class="menu-item" onclick="duplicateSelectedClip()">📋 复制片段</div>
    <div class="menu-item" onclick="deleteSelectedClipOrTrack()">🗑️ 删除片段</div>
    <div class="menu-divider"></div>
    <div class="menu-item" onclick="closeContextMenu()">关闭</div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>


  <!-- ==================== 状态管理 ==================== -->

  <script src="js/state.js"></script>
  <script src="js/konva.js"></script>
  <script src="js/dom.js"></script>
  <!-- // ==================== 时间轴渲染 ==================== -->
  <script src="js/ruler.js"></script>
  <!-- 轨道 -->
  <script src="js/tracks.js"></script>
  <!-- 切片 -->
  <script src="js/clip.js"></script>
  <!-- ==================== 播放头相关 ==================== -->
  <script src="js/playhead.js"></script>
  <!--  ==================== 视频预览 ==================== -->
  <script src="js/video.js"></script>
  <!-- ==================== 播放控制 ==================== -->
  <script src="js/playBtn.js"></script>
  <!-- ==================== 滑动区域 ==================== -->
  <script src="js/scroll.js"></script>
  <script src="js/tool.js"></script>
  <script src="js/listeners.js"></script>
  <script src="js/itemKeyframe.js"></script>
  <script src="js/ffmpeg.js"></script>
  <script src="js/imagePool.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/altcon.js"></script>
  <script src="js/sound.js"></script>
  <script src="js/pageOperation.js"></script>
  <script src="js/imagecompositing.js"></script>
  <script src="js/childWin.js"></script>


  <script>
    // ==================== 初始化 ====================
    // 更新所有页面内容
    function upDataAllUI() {
      updateMaxTime();
      renderRuler();
      renderTracks();
      updatePlayheadPosition();
      setupEventListeners();
      updateTimeDisplay();
    }
    // 导入文件，重新开始
    function AllNewStart(inStateData) {
      myState.reStart(inStateData.state)
      state = myState.get()
      myStage.reSetKeyframes(inStateData)
      upDataAllUI()
    }

    function init() {
      //后端上传接口地址
      UPLOAD_API_URL = '/api/upload/frame';
      myState = new myStateClass()
      state = myState.get()

      myStage = new myStageClass(state)
      myAudio = new myAudioClass(state)

      myPageOperation = new myPageOperationClass()
      new Sound()

      upDataAllUI()
    }

    // ==================== 启动 ====================
    init();
    console.log('🚀 视频剪辑时间线 + 实时预览已就绪');
    console.log('  - 空格键：播放/暂停');
    console.log('  - Ctrl+滚轮：缩放时间轴');
    console.log('  - 点击标尺/轨道空白：跳转');
    console.log('  - 拖拽红色播放头：定位');
    console.log('  - 点击预览区：加载视频文件');
    console.log('  - 右键片段：复制/删除');
    console.log('  - w,s 上箭头 下箭头 ：图层移动');
  </script>
</body>

</html>
